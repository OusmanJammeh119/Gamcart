<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GamCart — Shop Local Across The Gambia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start sm:py-6 text-slate-900">

  <!-- Mobile-First App Shell -->
  <div id="app" class="w-full max-w-[460px] bg-slate-50 min-h-screen sm:min-h-[840px] sm:h-[840px] sm:rounded-[34px] sm:shadow-2xl sm:border sm:border-slate-200/80 flex flex-col relative overflow-hidden">

    <!-- Top App Header -->
    <header class="bg-emerald-700 text-white px-4 pt-4 pb-3 sticky top-0 z-30 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-amber-400 text-emerald-950 flex items-center justify-center font-extrabold text-lg shadow-inner">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="font-extrabold text-lg tracking-tight leading-none">GamCart</h1>
              <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-800/90 text-amber-300 px-1.5 py-0.5 rounded-md border border-emerald-600">GM</span>
            </div>
            <p class="text-[11px] text-emerald-100 mt-0.5 flex items-center gap-1">
              <svg class="w-3 h-3 text-amber-300 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
              </svg>
              Greater Banjul & West Coast
            </p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <span class="bg-[#1DC4FF] text-slate-950 text-[10px] font-extrabold px-2 py-1 rounded-lg shadow-sm">Wave</span>
          <span class="bg-amber-400 text-slate-950 text-[10px] font-extrabold px-2 py-1 rounded-lg shadow-sm">APS</span>
        </div>
      </div>

      <!-- Search & Area Filter (Shown on Shop Tab) -->
      <div id="shop-search-bar" class="flex gap-2">
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
          </svg>
          <input
            id="search-input"
            type="text"
            placeholder="Search phones, rice, clothes, shops..."
            oninput="handleSearch(this.value)"
            class="w-full bg-white text-slate-900 placeholder-slate-400 text-xs font-medium pl-9 pr-3 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400"
          />
        </div>
        <select
          id="area-filter"
          onchange="handleAreaFilter(this.value)"
          class="bg-emerald-800 text-white text-xs font-semibold px-2.5 py-2.5 rounded-xl border border-emerald-600 focus:outline-none focus:ring-2 focus:ring-amber-400"
        >
          <option value="All">All Areas</option>
          <option value="Serrekunda">Serrekunda</option>
          <option value="Brusubi">Brusubi</option>
          <option value="Jabang">Jabang</option>
          <option value="Banjul">Banjul</option>
          <option value="Brikama">Brikama</option>
          <option value="Bakau">Bakau</option>
        </select>
      </div>
    </header>

    <!-- Main Scrollable Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto pb-24"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center sticky bottom-0 z-30">
      <button onclick="switchTab('shop')" id="nav-shop" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-emerald-700 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="text-[11px]">Shop</span>
      </button>

      <button onclick="switchTab('cart')" id="nav-cart" class="nav-btn relative flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-slate-500 font-medium">
        <div class="relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span id="cart-badge" class="hidden absolute -top-1.5 -right-2 bg-amber-500 text-slate-950 text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center shadow">0</span>
        </div>
        <span class="text-[11px]">Cart</span>
      </button>

      <button onclick="switchTab('seller')" id="nav-seller" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-slate-500 font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span class="text-[11px]">Seller Hub</span>
      </button>

      <button onclick="switchTab('orders')" id="nav-orders" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-slate-500 font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        <span class="text-[11px]">Orders</span>
      </button>
    </nav>

    <!-- Product Detail & Direct Contact Modal -->
    <div id="product-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="product-modal-content" class="bg-white w-full max-w-[460px] rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto"></div>
    </div>

    <!-- Wave / APS Payment Sheet Modal -->
    <div id="payment-modal" class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="payment-modal-content" class="bg-white w-full max-w-[460px] rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-slide-up"></div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 max-w-[90%]">
      <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
      <span id="toast-message">Action completed</span>
    </div>
  </div>

  <script>
    const COMMISSION_RATE = 0.01;
    const STORAGE_KEY = 'gamcart_state_v1';

    const PAYMENT_CONFIG = {
      merchantName: 'GamCart Marketplace GM',
      waveMerchantLabel: 'Wave Merchant — GamCart GM',
      waveNumberOrCode: '+220 300 0001 (Merchant Code: GC-WAVE)',
      apsMerchantLabel: 'APS Money — GamCart GM',
      apsNumberOrCode: '+220 300 0002 (APS ID: GC-APS)',
      dispatchWhatsApp: '2203000000'
    };

    const AREA_ZONES = {
      Jabang: { zone: 1, label: 'Core Kombo (Zone 1)' },
      Serrekunda: { zone: 1, label: 'Core Kombo (Zone 1)' },
      Bakau: { zone: 1, label: 'Core Kombo (Zone 1)' },
      Brusubi: { zone: 1, label: 'Core Kombo (Zone 1)' },
      Banjul: { zone: 2, label: 'Extended Hub (Zone 2)' },
      Brikama: { zone: 2, label: 'Extended Hub (Zone 2)' }
    };

    const SAMPLE_PHOTOS = [
      { label: 'Streetwear Tee', url: 'https://placehold.co/600x400/d1fae5/065f46?text=Streetwear+Tee' },
      { label: 'Smartphone', url: 'https://placehold.co/600x400/e0f2fe/075985?text=Smartphone+GM' },
      { label: 'Rice & Groceries', url: 'https://placehold.co/600x400/fef3c7/92400e?text=Groceries+GM' },
      { label: 'Home & Solar', url: 'https://placehold.co/600x400/ccfbf1/115e59?text=Home+%26+Solar' }
    ];

    function createDefaultState() {
      return {
        activeTab: 'shop',
        selectedCategory: 'All',
        selectedArea: 'All',
        searchQuery: '',
        deliveryMode: 'delivery',
        buyerArea: 'Jabang',
        selectedPaymentMethod: 'Wave',
        sellerDraftImage: null,
        products: [
          {
            id: 'p1',
            title: 'Heavyweight Streetwear Tee',
            price: 850,
            category: 'Fashion',
            shop: 'QYLO Apparel',
            area: 'Jabang',
            phone: '2203456789',
            verified: true,
            accent: 'bg-emerald-100 text-emerald-800',
            imageUrl: 'https://placehold.co/600x400/d1fae5/065f46?text=Streetwear+Tee',
            description: '100% heavy cotton oversized t-shirt. Available in Black, Cream, and Forest Green (M, L, XL).'
          },
          {
            id: 'p2',
            title: 'iPhone 13 Pro Max (256GB)',
            price: 38500,
            category: 'Electronics',
            shop: 'Kairaba Gadgets',
            area: 'Serrekunda',
            phone: '2207891234',
            verified: true,
            accent: 'bg-sky-100 text-sky-800',
            imageUrl: 'https://placehold.co/600x400/e0f2fe/075985?text=iPhone+13+Pro+Max',
            description: 'Factory unlocked, clean body with original fast charger included. Available for pickup or rider delivery.'
          },
          {
            id: 'p3',
            title: '50kg Basmati Rice Bag',
            price: 2450,
            category: 'Groceries',
            shop: 'Brusubi Daily Mart',
            area: 'Brusubi',
            phone: '2202345678',
            verified: true,
            accent: 'bg-amber-100 text-amber-800',
            imageUrl: 'https://placehold.co/600x400/fef3c7/92400e?text=50kg+Basmati+Rice',
            description: 'Premium long-grain aromatic rice. Fresh stock at Brusubi for compound or shop delivery.'
          },
          {
            id: 'p4',
            title: 'Solar Rechargeable Standing Fan',
            price: 4200,
            category: 'Home',
            shop: 'Brikama Home & Solar',
            area: 'Brikama',
            phone: '2205123456',
            verified: true,
            accent: 'bg-teal-100 text-teal-800',
            imageUrl: 'https://placehold.co/600x400/ccfbf1/115e59?text=Solar+Standing+Fan',
            description: '16-inch AC/DC rechargeable fan with solar panel included for reliable backup power.'
          }
        ],
        cart: [{ productId: 'p1', qty: 1 }],
        orders: [
          {
            id: 'GC-8492',
            date: 'Today, 11:20 AM',
            buyerName: 'Modou Jallow',
            buyerPhone: '+220 391 4402',
            deliveryMode: 'delivery',
            buyerArea: 'Brusubi',
            landmark: 'Brusubi Phase 2, near the mosque',
            deliveryFee: 100,
            paymentMethod: 'Wave',
            status: 'Paid via Wave',
            items: [
              { title: '50kg Basmati Rice Bag', shop: 'Brusubi Daily Mart', shopPhone: '2202345678', price: 2450, qty: 1 }
            ],
            subtotal: 2450,
            totalPaid: 2550,
            commission: 24.5,
            sellerPayout: 2425.5
          }
        ]
      };
    }

    function loadPersistedState() {
      const defaults = createDefaultState();
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return defaults;
        return {
          ...defaults,
          activeTab: ['shop', 'cart', 'seller', 'orders'].includes(parsed.activeTab) ? parsed.activeTab : defaults.activeTab,
          selectedCategory: typeof parsed.selectedCategory === 'string' ? parsed.selectedCategory : defaults.selectedCategory,
          selectedArea: typeof parsed.selectedArea === 'string' ? parsed.selectedArea : defaults.selectedArea,
          searchQuery: typeof parsed.searchQuery === 'string' ? parsed.searchQuery : '',
          deliveryMode: parsed.deliveryMode === 'pickup' ? 'pickup' : 'delivery',
          buyerArea: AREA_ZONES[parsed.buyerArea] ? parsed.buyerArea : defaults.buyerArea,
          selectedPaymentMethod: parsed.selectedPaymentMethod === 'APS' ? 'APS' : 'Wave',
          sellerDraftImage: null,
          products: Array.isArray(parsed.products) && parsed.products.length > 0 ? parsed.products : defaults.products,
          cart: Array.isArray(parsed.cart) ? parsed.cart : defaults.cart,
          orders: Array.isArray(parsed.orders) ? parsed.orders : defaults.orders
        };
      } catch (err) {
        return defaults;
      }
    }

    function savePersistedState() {
      try {
        const payload = {
          activeTab: state.activeTab,
          selectedCategory: state.selectedCategory,
          selectedArea: state.selectedArea,
          searchQuery: state.searchQuery,
          deliveryMode: state.deliveryMode,
          buyerArea: state.buyerArea,
          selectedPaymentMethod: state.selectedPaymentMethod,
          products: state.products,
          cart: state.cart,
          orders: state.orders
        };
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        if (err && (err.name === 'QuotaExceededError' || err.code === 22)) {
          showToast('Saved in session (browser storage full from uploaded photos).');
        }
      }
    }

    function resetDemoStorage() {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        // Ignore storage errors
      }
      const fresh = createDefaultState();
      Object.assign(state, fresh);
      const searchInput = document.getElementById('search-input');
      const areaFilter = document.getElementById('area-filter');
      if (searchInput) searchInput.value = '';
      if (areaFilter) areaFilter.value = 'All';
      updateCartBadge();
      switchTab('shop');
      showToast('Reset GamCart to default sample data.');
    }

    const state = loadPersistedState();

    function formatGMD(amount) {
      return 'D' + Number(amount).toLocaleString('en-US', {
        minimumFractionDigits: amount % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    function getZoneInfo(area) {
      return AREA_ZONES[area] || { zone: 1, label: 'Core Kombo (Zone 1)' };
    }

    function calculateDeliveryBreakdown(detailedItems, deliveryMode, buyerArea) {
      if (deliveryMode === 'pickup') {
        return {
          fee: 0,
          summary: 'Self-Pickup at Shop (D0)',
          stopDetails: detailedItems.map(item => `${item.shop} (${item.area}): D0`)
        };
      }
      const buyerZone = getZoneInfo(buyerArea).zone;
      let totalFee = 0;
      const stopDetails = detailedItems.map(item => {
        const shopZone = getZoneInfo(item.area).zone;
        const stopFee = shopZone === buyerZone ? 100 : 200;
        totalFee += stopFee;
        const routeLabel = shopZone === buyerZone ? 'Same Zone' : 'Cross-Zone';
        return `${item.shop} (${item.area} → ${buyerArea}, ${routeLabel}): ${formatGMD(stopFee)}`;
      });
      return {
        fee: totalFee,
        summary: `Rider Delivery to ${buyerArea} (${getZoneInfo(buyerArea).label})`,
        stopDetails
      };
    }

    function formatPhoneDisplay(rawPhone) {
      const clean = rawPhone.replace(/\D/g, '');
      if (clean.length === 10 && clean.startsWith('220')) {
        return `+220 ${clean.slice(3, 6)} ${clean.slice(6)}`;
      }
      return `+${clean}`;
    }

    function copyTextToClipboard(text, successMsg = 'Copied to clipboard') {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => showToast(text));
        } else {
          showToast(text);
        }
      } catch (err) {
        showToast(text);
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      msgEl.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3200);
    }

    function openWhatsAppChat(phone, shopName, productTitle, price) {
      const cleanPhone = phone.replace(/\D/g, '');
      const text = encodeURIComponent(
        `Salam ${shopName}! I saw "${productTitle}" on GamCart for ${formatGMD(price)}. Is it still available?`
      );
      showToast(`Opening WhatsApp chat with ${shopName}...`);
      window.open(`https://wa.me/${cleanPhone}?text=${text}`, '_blank', 'noopener,noreferrer');
    }

    function callSeller(phone, shopName) {
      const cleanPhone = phone.replace(/\D/g, '');
      showToast(`Dialing ${shopName} (${formatPhoneDisplay(cleanPhone)})...`);
      window.location.href = `tel:+${cleanPhone}`;
    }

    function getFallbackImageUrl(product) {
      const label = encodeURIComponent((product && product.title ? product.title : 'GamCart Item').slice(0, 26));
      return `https://placehold.co/600x400/ecfdf5/065f46?text=${label}`;
    }

    function renderProductVisual(product, className = 'w-full h-28') {
      const safeSrc = product.imageUrl || getFallbackImageUrl(product);
      const fallbackSrc = getFallbackImageUrl(product);
      return `
        <div class="${className} ${product.accent || 'bg-emerald-100 text-emerald-800'} relative overflow-hidden flex items-center justify-center">
          <img
            src="${safeSrc}"
            alt="${(product.title || 'Product').replace(/"/g, '&quot;')}"
            onerror="this.onerror=null; this.src='${fallbackSrc}';"
            class="w-full h-full object-cover"
          />
        </div>
      `;
    }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      const totalQty = state.cart.reduce((sum, item) => sum + item.qty, 0);
      if (totalQty > 0) {
        badge.textContent = totalQty;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function addToCart(productId, event) {
      if (event) event.stopPropagation();
      const product = state.products.find(p => p.id === productId);
      if (!product) return;
      const existing = state.cart.find(c => c.productId === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ productId, qty: 1 });
      }
      savePersistedState();
      updateCartBadge();
      showToast(`Added "${product.title}" to cart`);
      if (state.activeTab === 'cart') renderApp();
    }

    function changeCartQty(productId, delta) {
      const idx = state.cart.findIndex(c => c.productId === productId);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      savePersistedState();
      updateCartBadge();
      renderApp();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      savePersistedState();
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-emerald-700', 'font-bold');
        btn.classList.add('text-slate-500', 'font-medium');
      });
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-500', 'font-medium');
        activeBtn.classList.add('text-emerald-700', 'font-bold');
      }
      const searchBar = document.getElementById('shop-search-bar');
      if (tab === 'shop') searchBar.classList.remove('hidden');
      else searchBar.classList.add('hidden');
      renderApp();
    }

    function handleSearch(val) {
      state.searchQuery = val.trim().toLowerCase();
      savePersistedState();
      renderApp();
    }

    function handleAreaFilter(area) {
      state.selectedArea = area;
      savePersistedState();
      renderApp();
    }

    function selectCategory(cat) {
      state.selectedCategory = cat;
      savePersistedState();
      renderApp();
    }

    function openProductModal(productId) {
      const p = state.products.find(item => item.id === productId);
      if (!p) return;
      const modal = document.getElementById('product-modal');
      const content = document.getElementById('product-modal-content');
      content.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">${p.category}</span>
          <button onclick="closeProductModal()" class="p-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="w-full h-36 rounded-2xl ${p.accent} flex flex-col items-center justify-center mb-4 overflow-hidden relative">
          ${renderProductVisual(p, 'w-full h-36')}
          <span class="absolute bottom-2 right-2 text-[11px] font-bold bg-slate-900/75 text-white px-2.5 py-1 rounded-lg">${p.shop} • ${p.area}</span>
        </div>
        <div class="flex justify-between items-start gap-3 mb-2">
          <h2 class="text-lg font-extrabold text-slate-900 leading-snug">${p.title}</h2>
          <span class="text-xl font-extrabold text-emerald-700 shrink-0">${formatGMD(p.price)}</span>
        </div>
        <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 mb-4 flex items-center justify-between">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-bold text-slate-900">${p.shop}</span>

              <button type="button" onclick="state.deliveryMode='delivery'; savePersistedState(); renderApp();"

                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-slate-900">Rider Delivery</span>
                  <span class="text-[11px] font-extrabold text-amber-700">${formatGMD(calculateDeliveryBreakdown(detailedItems, 'delivery', state.buyerArea).fee)}</span>
                </div>
                <p class="text-[10px] text-slate-500 mt-1">Cash in hand on arrival</p>

            <input id="checkout-phone" type="tel" required placeholder="Your Phone / WhatsApp (+220...)" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5" />
            ${state.deliveryMode === 'delivery' ? `
              <select id="checkout-area" onchange="state.buyerArea=this.value; savePersistedState(); renderApp();" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 font-semibold text-slate-800">
                ${areasList.map(area => `<option value="${area}" ${state.buyerArea === area ? 'selected' : ''}>${area} — ${getZoneInfo(area).label}</option>`).join('')}
              </select>
              <input id="checkout-landmark" type="text" required placeholder="Drop-off landmark (junction, mosque, gate color)" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5" />

              <input id="checkout-landmark" type="text" placeholder="Pickup note (optional)" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5" />

            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" onclick="state.selectedPaymentMethod='Wave'; savePersistedState(); renderApp();" class="p-3 rounded-xl border-2 text-left ${state.selectedPaymentMethod === 'Wave' ? 'border-[#1DC4FF] bg-[#1DC4FF]/10' : 'border-slate-200'}">
                <span class="inline-block bg-[#1DC4FF] text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded">Wave</span>
              </button>
              <button type="button" onclick="state.selectedPaymentMethod='APS'; savePersistedState(); renderApp();" class="p-3 rounded-xl border-2 text-left ${state.selectedPaymentMethod === 'APS' ? 'border-amber-500 bg-amber-50' : 'border-slate-200'}">
                <span class="inline-block bg-amber-400 text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded">APS</span>
              </button>
            </div>
            <div class="border-t border-slate-100 pt-3 space-y-1 text-xs">
              <div class="flex justify-between"><span>Item Subtotal (99% Seller / 1% GamCart)</span><span class="font-bold">${formatGMD(subtotal)}</span></div>
              <div class="flex justify-between"><span>Rider Delivery (Cash in Hand on Arrival)</span><span class="font-bold">${formatGMD(delivery.fee)}</span></div>

            <button type="submit" class="w-full py-3.5 rounded-xl font-extrabold text-sm bg-emerald-700 hover:bg-emerald-800 text-white shadow-md">

    function openPaymentModal(event, subtotal, deliveryFee) {
      event.preventDefault();
      const buyerName = document.getElementById('checkout-name').value.trim();
      const buyerPhone = document.getElementById('checkout-phone').value.trim();
      const landmarkInput = document.getElementById('checkout-landmark');
      const landmark = landmarkInput ? landmarkInput.value.trim() || 'Self-Pickup at Seller Shop' : 'Self-Pickup at Seller Shop';
      const method = state.selectedPaymentMethod;
      const commission = Number((subtotal * COMMISSION_RATE).toFixed(2));
      const sellerPayout = Number((subtotal - commission).toFixed(2));
      const draftOrderRef = 'GC-' + Math.floor(1000 + Math.random() * 9000);
      const channelDetail = method === 'Wave' ? PAYMENT_CONFIG.waveNumberOrCode : PAYMENT_CONFIG.apsNumberOrCode;

      const modal = document.getElementById('payment-modal');
      const content = document.getElementById('payment-modal-content');
      content.innerHTML = `
        <div class="text-center">
          <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-900">${method} Item Settlement</span>
          <h3 class="text-lg font-extrabold text-slate-900 mt-2">Order ${draftOrderRef}</h3>
          <p class="text-xs text-slate-500 mt-1">Pay <strong>${formatGMD(subtotal)}</strong> via ${method} (${formatGMD(sellerPayout)} seller net + ${formatGMD(commission)} GamCart 1%). Pay <strong>${formatGMD(deliveryFee)}</strong> cash in hand to rider on arrival.</p>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 my-3.5 space-y-1.5 text-xs">
          <div class="flex justify-between"><span class="text-slate-500">Payment Channel</span><span class="font-bold">${channelDetail}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Seller Share (99%)</span><span class="font-bold text-emerald-700">${formatGMD(sellerPayout)}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">GamCart Share (1%)</span><span class="font-bold text-slate-900">${formatGMD(commission)}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Rider Delivery Fee (Cash)</span><span class="font-bold text-amber-800">${formatGMD(deliveryFee)}</span></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="document.getElementById('payment-modal').classList.add('hidden')" class="py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">Back</button>
          <button type="button" onclick="completeOrder('${buyerName.replace(/'/g, "\\'")}', '${buyerPhone.replace(/'/g, "\\'")}', '${state.buyerArea.replace(/'/g, "\\'")}', '${landmark.replace(/'/g, "\\'")}', ${subtotal}, ${deliveryFee}, '${draftOrderRef}')" class="py-2.5 rounded-xl bg-emerald-700 text-white font-extrabold text-xs">Confirm Order</button>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function completeOrder(buyerName, buyerPhone, buyerArea, landmark, subtotal, deliveryFee, customOrderId) {
      const detailedItems = state.cart.map(c => {
        const product = state.products.find(p => p.id === c.productId);
        return product ? { title: product.title, shop: product.shop, shopPhone: product.phone, price: product.price, qty: c.qty } : null;
      }).filter(Boolean);
      const commission = Number((subtotal * COMMISSION_RATE).toFixed(2));
      const sellerPayout = Number((subtotal - commission).toFixed(2));

      state.orders.unshift({
        id: customOrderId || ('GC-' + Math.floor(1000 + Math.random() * 9000)),
        date: 'Just now',
        buyerName,
        buyerPhone,
        deliveryMode: state.deliveryMode,
        buyerArea,
        landmark,
        deliveryFee,
        paymentMethod: state.selectedPaymentMethod,
        status: `Logged (${state.selectedPaymentMethod})`,
        items: detailedItems,
        subtotal,
        totalPaid: subtotal + deliveryFee,
        commission,
        sellerPayout
      });
      state.cart = [];
      savePersistedState();
      updateCartBadge();
      document.getElementById('payment-modal').classList.add('hidden');
      showToast('Order saved to GamCart Orders!');
      switchTab('orders');
    }

    function handleDraftPhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 800;
          let width = img.width;
          let height = img.height;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height >= width && height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          state.sellerDraftImage = canvas.toDataURL('image/jpeg', 0.78);
          renderApp();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleAddProduct(event) {
      event.preventDefault();
      const title = document.getElementById('new-prod-title').value.trim();
      const price = Number(document.getElementById('new-prod-price').value);
      const category = document.getElementById('new-prod-cat').value;
      const shop = document.getElementById('new-prod-shop').value.trim();
      const area = document.getElementById('new-prod-area').value;
      const phone = document.getElementById('new-prod-phone').value.trim().replace(/\D/g, '') || '2203000000';
      const description = document.getElementById('new-prod-desc').value.trim();

      if (!state.sellerDraftImage) {
        showToast('Please upload or choose a product photo first.');
        return;
      }

      const newProduct = {
        id: 'p_' + Date.now(),
        title,
        price,
        category,
        shop,
        area,
        phone,
        verified: true,
        accent: 'bg-emerald-100 text-emerald-800',
        imageUrl: state.sellerDraftImage,
        description
      };

      state.products.unshift(newProduct);
      state.sellerDraftImage = null;
      savePersistedState();
      showToast(`Published "${title}" to GamCart!`);
      switchTab('shop');
    }

              <input type="file" accept="image/*" onchange="handleDraftPhotoUpload(event)" class="w-full text-xs text-slate-600" />
              <div class="flex flex-wrap gap-1.5">
                ${SAMPLE_PHOTOS.map(sp => `
                  <button type="button" onclick="state.sellerDraftImage='${sp.url}'; renderApp();" class="text-[10px] font-bold bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg">
                    Use ${sp.label}

    function renderOrdersView() {
      return `
        <div class="p-4 space-y-3">
          <h2 class="text-base font-extrabold text-slate-900">Orders (${state.orders.length})</h2>
          ${state.orders.map(order => `
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-2 text-xs">
              <div class="flex justify-between font-extrabold">
                <span>${order.id} • ${order.status}</span>
                <span class="text-emerald-700">${formatGMD(order.totalPaid)}</span>
              </div>
              <p class="text-slate-600">Buyer: ${order.buyerName} (${order.buyerPhone})</p>
              <p class="text-slate-600">Fulfillment: ${order.deliveryMode === 'delivery' ? `Rider to ${order.buyerArea} (${order.landmark}) — Cash Fee ${formatGMD(order.deliveryFee)}` : `Self-Pickup (D0) — ${order.landmark}`}</p>
              <p class="text-[11px] text-emerald-800 font-semibold">99% Seller: ${formatGMD(order.sellerPayout)} • 1% GamCart: ${formatGMD(order.commission)}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderApp() {
      const container = document.getElementById('main-content');
      if (!container) return;
      if (state.activeTab === 'cart') container.innerHTML = renderCartView();
      else if (state.activeTab === 'seller') container.innerHTML = renderSellerView();
      else if (state.activeTab === 'orders') container.innerHTML = renderOrdersView();
      else container.innerHTML = renderShopView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();
      switchTab(state.activeTab || 'shop');
    });
  </script>
