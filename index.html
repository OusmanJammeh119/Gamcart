<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GamCart — Shop Local Across The Gambia</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-dark: #059669;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 84px; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .brand { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
    .sub { font-size: 0.75rem; color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, input, select {
      border-radius: 10px; border: 1px solid var(--border);
      padding: 9px 12px; font-size: 0.9rem; background: var(--card-2); color: var(--text);
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button.primary { background: var(--accent); color: #052e16; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-dark); color: #fff; }
    button.ghost { background: transparent; }
    main { max-width: 960px; margin: 16px auto; padding: 0 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .price { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .meta { font-size: 0.8rem; color: var(--muted); }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .status { font-size: 0.85rem; color: var(--accent); min-height: 20px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">GamCart</div>
      <div class="sub">Jabang • Brusubi • Serrekunda • Salagi • 99% Seller / 1% Platform</div>
    </div>
    <div class="row" id="authBar">
      <span class="meta" id="userLabel">Guest</span>
      <button class="primary" id="openAuthBtn">Log In / Sign Up</button>
      <button class="ghost" id="logoutBtn" style="display:none;">Log Out</button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="primary" data-tab="shop">Shop</button>
      <button class="ghost" data-tab="seller">Seller Hub</button>
      <button class="ghost" data-tab="cart">Cart (<span id="cartCount">0</span>)</button>
      <button class="ghost" data-tab="orders">Orders</button>
    </div>

    <!-- SHOP VIEW -->
    <section id="tab-shop">
      <div class="grid" id="productList"></div>
    </section>

    <!-- SELLER HUB VIEW -->
    <section id="tab-seller" style="display:none;">
      <div class="panel">
        <h2>List a New Product</h2>
        <p class="meta">Sellers keep 99% of item price; GamCart takes 1%. Delivery fee is paid cash in hand to the rider.</p>
        <form id="addProductForm" class="form-grid">
          <input type="text" id="pName" placeholder="Product name (e.g., iPhone Charger)" required />
          <input type="number" id="pPrice" placeholder="Price in GMD (e.g., 450)" min="1" required />
          <input type="text" id="pShop" placeholder="Shop name & area (e.g., Jabang Tech)" required />
          <input type="number" id="pDelivery" placeholder="Cash delivery fee GMD (0 = pickup)" min="0" value="50" required />
          <button type="submit" class="primary">Publish Product</button>
        </form>
        <div class="status" id="sellerStatus"></div>
      </div>
    </section>

    <!-- CART VIEW -->
    <section id="tab-cart" style="display:none;">
      <div class="panel">
        <h2>Your Cart</h2>
        <div id="cartItems" class="stack"></div>
        <div id="cartSummary" class="meta" style="margin-top:12px;"></div>
        <div class="form-grid" style="margin-top:12px;">
          <input type="text" id="buyerName" placeholder="Your full name" />
          <input type="text" id="buyerPhone" placeholder="Phone / WhatsApp (+220...)" />
          <select id="buyerArea">
            <option value="Jabang">Jabang</option>
            <option value="Brusubi">Brusubi</option>
            <option value="Serrekunda">Serrekunda</option>
            <option value="Salagi">Salagi</option>
            <option value="Greater Banjul Area">Greater Banjul Area</option>
          </select>
          <button class="primary" id="placeOrderBtn">Place Order (Cash on Delivery)</button>
        </div>
        <div class="status" id="orderStatus"></div>
      </div>
    </section>

    <!-- ORDERS VIEW -->
    <section id="tab-orders" style="display:none;">
      <div class="panel">
        <h2>Recent Orders</h2>
        <div id="orderList" class="stack"></div>
      </div>
    </section>
  </main>

  <!-- AUTH MODAL -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <div class="row" style="justify-content:space-between;">
        <h3 id="authTitle">Log In to GamCart</h3>
        <button class="ghost" id="closeAuthBtn">✕</button>
      </div>
      <form id="authForm" class="stack">
        <input type="email" id="authEmail" placeholder="Email address" required />
        <input type="password" id="authPassword" placeholder="Password (6+ chars)" minlength="6" required />
        <select id="authRole" style="display:none;">
          <option value="buyer">Buyer Account</option>
          <option value="seller">Seller Account</option>
        </select>
        <button type="submit" class="primary" id="authSubmitBtn">Log In</button>
      </form>
      <button class="ghost" id="toggleAuthMode" style="width:100%; margin-top:10px;">Need an account? Sign Up</button>
      <div class="status" id="authStatus"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      signOut, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAb5G8UDQCuw_tczjEu1TV1Yxs_mP0N1UQ",
      authDomain: "gamcart.firebaseapp.com",
      projectId: "gamcart",
      storageBucket: "gamcart.firebasestorage.app",
      messagingSenderId: "1062604798893",
      appId: "1:1062604798893:web:f2d09d74c5f7664d643f24",
      measurementId: "G-KHFRZS2LCZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isSignUp = false;
    let cart = [];
    let products = [];

    const starterProducts = [
      { name: "Street Anthem Tee", price: 650, shop: "QYLO — Jabang", deliveryFee: 50 },
      { name: "Fast Charger & Cable", price: 400, shop: "Brusubi Gadgets", deliveryFee: 50 },
      { name: "Daily Essentials Bundle", price: 850, shop: "Serrekunda Mart", deliveryFee: 75 }
    ];

    // Tabs
    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.className = "ghost");
        btn.className = "primary";
        const target = btn.dataset.tab;
        ["shop", "seller", "cart", "orders"].forEach(t => {
          document.getElementById(`tab-${t}`).style.display = t === target ? "block" : "none";
        });
        if (target === "orders") loadOrders();
      });
    });

    // Auth UI
    const authModal = document.getElementById("authModal");
    document.getElementById("openAuthBtn").onclick = () => authModal.classList.add("open");
    document.getElementById("closeAuthBtn").onclick = () => authModal.classList.remove("open");
    document.getElementById("toggleAuthMode").onclick = () => {
      isSignUp = !isSignUp;
      document.getElementById("authTitle").textContent = isSignUp ? "Create GamCart Account" : "Log In to GamCart";
      document.getElementById("authSubmitBtn").textContent = isSignUp ? "Sign Up" : "Log In";
      document.getElementById("authRole").style.display = isSignUp ? "block" : "none";
      document.getElementById("toggleAuthMode").textContent = isSignUp ? "Already have an account? Log In" : "Need an account? Sign Up";
    };

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const pass = document.getElementById("authPassword").value;
      const role = document.getElementById("authRole").value;
      const statusEl = document.getElementById("authStatus");
      statusEl.textContent = "Working...";
      try {
        if (isSignUp) {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await updateProfile(cred.user, { displayName: role });
          statusEl.textContent = `Account created (${role})!`;
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
          statusEl.textContent = "Logged in!";
        }
        setTimeout(() => { authModal.classList.remove("open"); statusEl.textContent = ""; }, 600);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });

    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const label = document.getElementById("userLabel");
      const openBtn = document.getElementById("openAuthBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      if (user) {
        label.textContent = `${user.email} (${user.displayName || "member"})`;
        openBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
      } else {
        label.textContent = "Guest";
        openBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
      }
    });

    // Load & Seed Products
    async function loadProducts() {
      const listEl = document.getElementById("productList");
      listEl.innerHTML = "<p class='meta'>Loading live products...</p>";
      try {
        const snap = await getDocs(collection(db, "products"));
        products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (products.length === 0) {
          for (const item of starterProducts) {
            await addDoc(collection(db, "products"), item);
          }
          const seeded = await getDocs(collection(db, "products"));
          products = seeded.docs.map(d => ({ id: d.id, ...d.data() }));
        }
        renderProducts();
      } catch (err) {
        products = starterProducts.map((p, i) => ({ id: String(i), ...p }));
        renderProducts();
      }
    }

    function renderProducts() {
      const listEl = document.getElementById("productList");
      listEl.innerHTML = "";
      products.forEach((p) => {
        const sellerPayout = (Number(p.price) * 0.99).toFixed(2);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <strong>${p.name}</strong>
          <div class="price">GMD ${p.price}</div>
          <div class="meta">Shop: ${p.shop}</div>
          <div class="meta">Delivery (cash on arrival): ${Number(p.deliveryFee) === 0 ? "Free Pickup (GMD 0)" : `GMD ${p.deliveryFee}`}</div>
          <div class="meta">Seller keeps 99%: GMD ${sellerPayout}</div>
          <button class="primary" style="margin-top:auto;">Add to Cart</button>
        `;
        card.querySelector("button").onclick = () => {
          cart.push(p);
          renderCart();
        };
        listEl.appendChild(card);
      });
    }

    // Add Product (Seller Hub)
    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById("sellerStatus");
      const item = {
        name: document.getElementById("pName").value.trim(),
        price: Number(document.getElementById("pPrice").value),
        shop: document.getElementById("pShop").value.trim(),
        deliveryFee: Number(document.getElementById("pDelivery").value) || 0,
        ownerEmail: currentUser ? currentUser.email : "guest",
        createdAt: serverTimestamp()
      };
      try {
        await addDoc(collection(db, "products"), item);
        e.target.reset();
        statusEl.textContent = "Published to live GamCart catalog!";
        loadProducts();
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });

    // Cart & Checkout
    function renderCart() {
      document.getElementById("cartCount").textContent = cart.length;
      const box = document.getElementById("cartItems");
      const summary = document.getElementById("cartSummary");
      if (cart.length === 0) {
        box.innerHTML = "<p class='meta'>Your cart is empty.</p>";
        summary.textContent = "";
        return;
      }
      box.innerHTML = cart.map((c, idx) =>
        `<div class="row" style="justify-content:space-between;">
          <span>${c.name} (${c.shop}) — GMD ${c.price} + GMD ${c.deliveryFee || 0} delivery</span>
          <button class="ghost" onclick="removeCartItem(${idx})">Remove</button>
        </div>`
      ).join("");
      const itemsTotal = cart.reduce((s, c) => s + Number(c.price), 0);
      const deliveryTotal = cart.reduce((s, c) => s + Number(c.deliveryFee || 0), 0);
      const platformFee = (itemsTotal * 0.01).toFixed(2);
      const sellerTotal = (itemsTotal * 0.99).toFixed(2);
      summary.innerHTML = `Items: <strong>GMD ${itemsTotal}</strong> (Seller 99%: GMD ${sellerTotal} | Platform 1%: GMD ${platformFee})<br/>Cash Delivery Fee to Rider: <strong>GMD ${deliveryTotal}</strong>`;
    }

    window.removeCartItem = (idx) => {
      cart.splice(idx, 1);
      renderCart();
    };

    document.getElementById("placeOrderBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("orderStatus");
      const name = document.getElementById("buyerName").value.trim();
      const phone = document.getElementById("buyerPhone").value.trim();
      const area = document.getElementById("buyerArea").value;
      if (!cart.length) { statusEl.textContent = "Add an item first."; return; }
      if (!name || !phone) { statusEl.textContent = "Enter your name and phone/WhatsApp number."; return; }
      const itemsTotal = cart.reduce((s, c) => s + Number(c.price), 0);
      const deliveryTotal = cart.reduce((s, c) => s + Number(c.deliveryFee || 0), 0);
      try {
        await addDoc(collection(db, "orders"), {
          buyerName: name,
          buyerPhone: phone,
          area,
          items: cart,
          itemsTotal,
          deliveryFeeCashToRider: deliveryTotal,
          sellerPayout99: Number((itemsTotal * 0.99).toFixed(2)),
          platformFee1: Number((itemsTotal * 0.01).toFixed(2)),
          userId: currentUser ? currentUser.uid : "guest",
          createdAt: serverTimestamp()
        });
        cart = [];
        renderCart();
        statusEl.textContent = "Order placed! Pay delivery fee cash in hand to the rider upon arrival.";
      } catch (err) {
        statusEl.textContent = "Order error: " + err.message;
      }
    });

    async function loadOrders() {
      const list = document.getElementById("orderList");
      list.innerHTML = "<p class='meta'>Loading orders...</p>";
      try {
        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        const orders = snap.docs.map(d => d.data());
        if (!orders.length) { list.innerHTML = "<p class='meta'>No orders yet.</p>"; return; }
        list.innerHTML = orders.map(o =>
          `<div class="card">
            <strong>${o.buyerName} (${o.area})</strong>
            <div class="meta">Items: GMD ${o.itemsTotal} • Cash Delivery to Rider: GMD ${o.deliveryFeeCashToRider || 0}</div>
            <div class="meta">Seller 99%: GMD ${o.sellerPayout99} • Platform 1%: GMD ${o.platformFee1}</div>
          </div>`
        ).join("");
      } catch (err) {
        list.innerHTML = "<p class='meta'>Could not load orders right now.</p>";
      }
    }

    renderCart();
    loadProducts();
  </script>
</body>
</html>
